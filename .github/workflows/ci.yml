name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: steer
          POSTGRES_PASSWORD: steer
          POSTGRES_DB: steer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U steer -d steer"
          --health-interval 5s --health-timeout 5s --health-retries 15

    env:
      TEST_DATABASE_URL: postgresql://steer:steer@localhost:5432/steer?sslmode=disable

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (strict TS, no `any`)
        run: pnpm run typecheck
      - name: Test with coverage (enforced)
        run: pnpm run test:coverage
      - name: Install Playwright (chromium)
        run: pnpm --filter @steer/web exec playwright install --with-deps chromium
      - name: Two-window E2E
        run: pnpm --filter @steer/web e2e
      - name: Validate docker-compose
        run: docker compose config -q
