name: steer

# ============================================================
# Steer — full stack. `docker compose up --build` from a clean
# clone (after copying .env.example → .env) brings everything up.
#
# Exposed to the host: web (5173), server (8080), postgres (54321).
# NOT exposed: electric (internal), agent (PORTLESS, outbound only).
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    # wal_level=logical is REQUIRED for Electric's replication slot.
    command: postgres -c wal_level=logical -c max_wal_senders=10 -c max_replication_slots=10
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-steer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-steer}
      POSTGRES_DB: ${POSTGRES_DB:-steer}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-steer} -d ${POSTGRES_DB:-steer}"]
      interval: 3s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "54321:5432"

  electric:
    image: electricsql/electric:latest
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://steer:steer@postgres:5432/steer?sslmode=disable}
      # Dev only: Electric sits behind the server's auth proxy and is never
      # published to the host. Production swaps this for ELECTRIC_SECRET.
      ELECTRIC_INSECURE: "true"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/v1/health || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 20
    # Published to the host so an EXTERNAL run-anywhere daemon (`./steer-agent
    # --env <id>` on this machine) can subscribe to the sessions shape directly —
    # the server still proxies to it over the compose network too. Dev only:
    # Electric runs with ELECTRIC_INSECURE here; production keeps it unpublished
    # behind the server's auth proxy and swaps in ELECTRIC_SECRET.
    ports:
      - "3000:3000"

  # One-shot: runs DB migrations, then exits 0 before the app boots.
  migrate:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://steer:steer@postgres:5432/steer?sslmode=disable}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      target: runtime
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://steer:steer@postgres:5432/steer?sslmode=disable}
      ELECTRIC_URL: ${ELECTRIC_URL:-http://electric:3000}
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
      electric:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 20
    ports:
      - "8080:8080"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_SERVER_URL: ${VITE_SERVER_URL:-http://localhost:8080}
    environment:
      VITE_SERVER_URL: ${VITE_SERVER_URL:-http://localhost:8080}
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5173}:5173"

  # PORTLESS by design (PRD): connects outbound only to the server + Electric.
  agent:
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
    # Pinned so the default daemon's claim owner (os.hostname()) stays STABLE
    # across container recreation — otherwise a recreated default daemon could
    # not re-claim a session left 'running' by a crash (crash-only resume).
    hostname: steer-agent-default
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://steer:steer@postgres:5432/steer?sslmode=disable}
      ELECTRIC_URL: ${ELECTRIC_URL:-http://electric:3000}
      SERVER_URL: http://server:8080
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      # This container is the DEFAULT (unrouted) daemon: with STEER_ENV empty it
      # claims sessions created without an environment (web "New session", or
      # `steer` with no --env), preserving the single-daemon behavior. Set
      # STEER_ENV=<id> to make it a named environment instead; run a daemon on
      # another host (`steer-agent --env <id>`) to execute sessions routed there.
      # See README → "Run it anywhere".
      STEER_ENV: ${STEER_ENV:-}
      STEER_MCP_SERVERS: ${STEER_MCP_SERVERS:-}
      # The daemon's ROOT (sandbox boundary). The host filesystem is mounted at
      # /host below, so the agent can operate on any directory `steer` is run from
      # (the CLI sends its cwd; the daemon maps it under this root). Whole-machine
      # reach is intentional — see README "Run it anywhere" for the trust model.
      STEER_WORKSPACE_ROOT: /host
      STEER_MAX_STEPS: ${STEER_MAX_STEPS:-80}
    # Mount the host filesystem so a session bound to your cwd lands on real files
    # regardless of which machine pulled the stack down. Narrow it for a sandboxed
    # deploy:  WORKSPACE_DIR=~/dev/myapp docker compose up  (then cwd-routing only
    # resolves paths under that dir). On macOS/Windows, Docker Desktop must be
    # allowed to share the mounted path (Settings → Resources → File sharing).
    volumes:
      - ${WORKSPACE_DIR:-/}:/host
    depends_on:
      server:
        condition: service_healthy
      electric:
        condition: service_healthy

volumes:
  pgdata:
